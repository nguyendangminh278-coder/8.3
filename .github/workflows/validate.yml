name: Validate mobile story

on:
  push:
    paths:
      - '.github/workflows/validate.yml'
      - 'index.html'
      - 'styles.css'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact Canva watch embed
        run: |
          grep -q 'https://www.canva.com/design/DAHYdLjF2Pw/wDqJfFARVEA69KBaaCsbIQ/watch?embed' index.html
          grep -q 'aspect-ratio: 9 / 16' styles.css

      - name: Smoke test static server
        run: |
          python3 -m http.server 8080 >/tmp/wrapped-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'University Wrapped 20/10'
