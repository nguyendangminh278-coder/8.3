name: Snapshot Canva pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/snapshot-canva.yml'
      - 'scripts/canva-page-sources.json'
      - 'scripts/fetch-canva-pages.mjs'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install image dependency
        run: npm install --no-save sharp

      - name: Fetch Canva page previews
        run: node scripts/fetch-canva-pages.mjs

      - name: Commit page snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pages
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "Snapshot Canva pages for mobile site"
          git pull --rebase origin main
          git push origin HEAD:main
